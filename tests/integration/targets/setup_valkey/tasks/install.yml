- name: Download Valkey
  ansible.builtin.get_url:
    url: https://download.valkey.io/releases/valkey-{{ valkey_version }}-noble-x86_64.tar.gz
    dest: /tmp/valkey-{{ valkey_version }}.tar.gz

- name: Extract
  ansible.builtin.unarchive:
    src: /tmp/valkey-{{ valkey_version }}.tar.gz
    dest: /usr/local
    remote_src: true
    extra_opts: [--strip-components=1]

- name: Create acl file for valkey
  ansible.builtin.file:
    path: /valkey.acl
    state: touch
    mode: 600

- name: Start server
  ansible.builtin.command: valkey-server --aclfile /valkey.acl --daemonize yes

- name: Install Python driver
  ansible.builtin.pip:
    name: valkey
    state: present
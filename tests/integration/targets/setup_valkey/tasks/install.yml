- name: Download Valkey
  ansible.builtin.get_url:
    url: https://download.valkey.io/releases/valkey-{{ valkey_version }}-noble-x86_64.tar.gz
    dest: /tmp/valkey-{{ valkey_version }}.tar.gz

- name: Extract
  ansible.builtin.unarchive:
    src: /tmp/valkey-{{ valkey_version }}.tar.gz
    dest: /usr/local
    remote_src: true
    extra_opts: [--strip-components=1]

- name: Create acl file for valkey
  ansible.builtin.file:
    path: /valkey.acl
    state: touch
    mode: 600

- name: Create acl file for valkey2
  ansible.builtin.file:
    path: /valkey2.acl
    state: touch
    mode: 600

- name: Create directories
  ansible.builtin.file:
    state: directory
    name: "{{ item }}"
  loop:
    - /var/lib/valkey-6379/
    - /var/lib/valkey-6380/

- name: Start server
  ansible.builtin.command: valkey-server --aclfile /valkey.acl --daemonize yes --pidfile /var/run/valkey.pid --dir /var/lib/valkey-6379/

- name: Start another server
  ansible.builtin.command: valkey-server --aclfile /valkey2.acl --daemonize yes --port 6380 --pidfile /var/run/valkey2.pid --dir /var/lib/valkey-6380/

- name: Install Python driver
  ansible.builtin.pip:
    name: valkey
    state: present

- name: Set flag
  ansible.builtin.file:
    state: touch
    path: /tmp/server_up
- name: Change configs in check mode
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 100000
  register: result
  check_mode: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is true

- name: Check actual value
  rkozlo.valkey.valkey_exec:
    command: config_get
    args:
      - maxmemory
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.result['maxmemory'] == "0"

- name: Change configs in real mode
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 100000
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is true

- name: Check actual value
  rkozlo.valkey.valkey_exec:
    command: config_get
    args:
      - maxmemory
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.result['maxmemory'] == "100000"

- name: Change configs in real mode - idempotency
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 100000
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is false

- name: Change configs immutable not differ
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 100000
      appenddirname: appendonlydir
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is false

- name: Change configs immutable differ
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 100000
      appenddirname: appendonlydir2
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is false
      - result.immutable | length == 1

- name: Change configs in strict mode - should fail
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 100000
      appenddirname: appendonlydir2
    strict: true
  register: result
  ignore_errors: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.failed is true

- name: Change configs in strict mode - should pass
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 100000
      appenddirname: appendonlydir
    strict: true
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is false

- name: Change configs bool value - no change
  rkozlo.valkey.valkey_config:
    configs:
      appendonly: no
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is false

- name: Change configs bool value - changed
  rkozlo.valkey.valkey_config:
    configs:
      appendonly: yes
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is true

- name: Change configs more complex case
  rkozlo.valkey.valkey_config:
    configs:
      client-output-buffer-limit: "normal 1 1 1"
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is true

- name: Change configs more complex case
  rkozlo.valkey.valkey_config:
    configs:
      client-output-buffer-limit: "normal 1 1 1 slave 268435456 67108864 60 pubsub 33554432 8388608 60"
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is false

- name: Pass dummy config
  rkozlo.valkey.valkey_config:
    configs:
      dummy: "1"
  register: result
  ignore_errors: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.msg == "Config dummy is not known by this Valkey server."

- name: Change configs with testing normalization
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 100K
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is false

- name: Change configs with testing normalization
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 100mb
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is true

- name: Check actual value
  rkozlo.valkey.valkey_exec:
    command: config_get
    args:
      - maxmemory
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.result['maxmemory'] == "104857600"

- name: Try rewrite but not supported
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 101mb
    config_rewrite: true
  register: result
  ignore_errors: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.failed is true
      - result.msg == 'Config rewrite passed but not supported on this instance. Config file is not defined.'

- name: Change config in diff mode
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 102mb
  register: result
  diff: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is true
      - result.changed_configs | length == 1
      - result.changed_configs[0].name == 'maxmemory'
      - result.changed_configs[0].before == '104857600'
      - result.changed_configs[0].after == '106954752'
      - result.diff.before.maxmemory == '104857600'
      - result.diff.after.maxmemory == '106954752'

- name: Change multiple configs at once
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 10002
      maxmemory-policy: allkeys-random
      save: 1 1

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is true

- name: Check actual value
  rkozlo.valkey.valkey_exec:
    command: config_get
    args:
      - maxmemory
      - maxmemory-policy
      - save
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.result['maxmemory'] == "10002"
      - result.result['maxmemory-policy'] == "allkeys-random"
      - result.result['save'] == "1 1"

- name: Change multiple configs at once - idempotency
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 10002
      maxmemory-policy: allkeys-random
      save: 1 1
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is false


- name: Change config with rewrite supported
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 10002
    config_rewrite: true
    login_port: 6380
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is true

- name: Fetch config content
  ansible.builtin.slurp:
    src: /var/lib/valkey-6380/valkey.conf
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - "result.content | b64decode | regex_search('maxmemory 10002') | length > 0"

- name: Change config with rewrite supported - idempotency
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 10002
    config_rewrite: true
    login_port: 6380
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed is false

- name: Set default configs
  rkozlo.valkey.valkey_config:
    configs:
      client-output-buffer-limit: "normal 0 0 0 slave 268435456 67108864 60 pubsub 33554432 8388608 60"
      maxmemory: 0
      appendonly: false
      maxmemory-policy: noeviction
      save: 3600 1 300 100 60 10000

- name: Set default configs
  rkozlo.valkey.valkey_config:
    configs:
      maxmemory: 0
    login_port: 6380
    config_rewrite: true
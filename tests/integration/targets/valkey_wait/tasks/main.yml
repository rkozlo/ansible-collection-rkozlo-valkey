---
- name: Check if server is up
  rkozlo.valkey.valkey_wait:
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.failed == false

- name: Check if server is up - should fail
  rkozlo.valkey.valkey_wait:
    login_host: nonexists
    retries: 5
  register: result
  ignore_errors: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.failed == true
      - >
        result.msg == 'Failed: state'

- name: Check if server is up and replication role is met
  rkozlo.valkey.valkey_wait:
    conditions:
      role: master

- name: Check if server is up - another replica
  rkozlo.valkey.valkey_wait:
    login_port: 6380
    conditions:
      role: master

- name: Setup replication
  rkozlo.valkey.valkey_exec:
    login_port: 6380
    command: REPLICAOF
    args:
      - localhost
      - 6379

- name: Check if replication is up
  rkozlo.valkey.valkey_wait:
    login_port: 6380
    conditions:
      role: slave
      master_link_status: up

- name: Check if replica is connected
  rkozlo.valkey.valkey_wait:
    conditions:
      role: master
      connected_slaves: 1

- name: Check if replica is connected using comparison operators
  rkozlo.valkey.valkey_wait:
    conditions:
      role: "!= slave"
      connected_slaves: ">= 1"
      loading: "<1"
      uptime_in_seconds: "> 0"
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.info.role.comparator == '!='
      - result.info.role.expected == 'slave'
      - result.info.connected_slaves.comparator == '>='
      - result.info.connected_slaves.expected == '1'
      - result.info.loading.comparator == '<'
      - result.info.loading.expected == '1'

- name: Check if replication is up using comparison operators
  rkozlo.valkey.valkey_wait:
    login_port: 6380
    conditions:
      role: "==slave"
      master_link_status: "!= down"
      master_last_io_seconds_ago: "<= 60"

- name: Check primary has not enough replicas - should fail
  rkozlo.valkey.valkey_wait:
    retries: 2
    conditions:
      connected_slaves: "> 1"
  register: result
  ignore_errors: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.failed == true
      - >
        result.msg == "Failed: connected_slaves"
      - result.fail_waits.connected_slaves.last_value == 1

- name: Preceed switchover
  vars:
    primary_port: 6380
    replica_port: 6379
  ansible.builtin.include_tasks: repl_switchover.yml

- name: Check if replica is connected
  rkozlo.valkey.valkey_wait:
    login_port: 6380
    conditions:
      role: master
      connected_slaves: "1"

- name: Check if replication is up
  rkozlo.valkey.valkey_wait:
    login_port: 6379
    conditions:
      role: slave
      master_link_status: up

- name: Switchover to base roles
  vars:
    primary_port: 6379
    replica_port: 6380
  ansible.builtin.include_tasks: repl_switchover.yml

- name: Tear up replica
  rkozlo.valkey.valkey_exec:
    login_port: 6380
    command: REPLICAOF
    args:
      - "no"
      - one

- name: Ensure old replica state
  rkozlo.valkey.valkey_wait:
    login_port: 6380
    conditions:
      role: master
      connected_slaves: 0

- name: Ensure primary state
  rkozlo.valkey.valkey_wait:
    login_port: 6379
    conditions:
      role: master
      connected_slaves: 0

- name: Ensure primary state - should fail one not met
  rkozlo.valkey.valkey_wait:
    login_port: 6379
    retries: 3
    conditions:
      role: slave
      connected_slaves: 0
  register: result
  ignore_errors: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.failed == true
      - >
        result.msg == "Failed: role"

- name: Ensure primary state - should fail many not met
  rkozlo.valkey.valkey_wait:
    login_port: 6379
    retries: 3
    conditions:
      role: slave
      connected_slaves: 100
      loading: 1
  register: result
  ignore_errors: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.failed == true
      - >
        result.msg == "Failed: role, connected_slaves, loading"

- name: Ensure primary state - should fail key not in info
  rkozlo.valkey.valkey_wait:
    login_port: 6379
    retries: 3
    conditions:
      dummy_info: a
  register: result
  ignore_errors: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.failed == true

- name: Not equal on missing field - should fail
  rkozlo.valkey.valkey_wait:
    login_port: 6379
    retries: 2
    conditions:
      master_link_status: "!= down"
  register: result
  ignore_errors: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.failed == true
      - >
        result.msg == "Failed: master_link_status"
      - result.fail_waits.master_link_status.last_value is none

- name: Numeric comparator on non numeric field - should fail
  rkozlo.valkey.valkey_wait:
    login_port: 6379
    retries: 2
    conditions:
      role: "> 0"
  register: result
  ignore_errors: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.failed == true
      - >
        result.msg == "Failed: role"

- name: Numeric comparator with non numeric value - should fail early
  rkozlo.valkey.valkey_wait:
    login_port: 6379
    conditions:
      connected_slaves: ">= many"
  register: result
  ignore_errors: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.failed == true
      - "'requires numeric value' in result.msg"

- name: Unsupported comparator - should fail early
  rkozlo.valkey.valkey_wait:
    login_port: 6379
    conditions:
      connected_slaves: "=> 0"
  register: result
  ignore_errors: true

- name: Check result
  ansible.builtin.assert:
    that:
      - result.failed == true
      - "'Unsupported comparator' in result.msg"

- ansible.builtin.include_tasks: cluster_tests.yml

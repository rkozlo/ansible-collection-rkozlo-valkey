name: Plugins CI
on:
  push:
    paths:
      - 'plugins/**'
      - 'tests/**'
      - '.github/workflows/ansible-test-plugins.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'tests/**'
      - '.github/workflows/ansible-test-plugins.yml'
  schedule:
    - cron: '0 6 * * 6'

jobs:
  sanity:
    name: "Sanity (Ansible: ${{ matrix.ansible }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ansible:
          - stable-2.18
          - stable-2.19
          - stable-2.20
          - stable-2.21
          - devel

    steps:
      - name: Run sanity tests
        uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: sanity
          coverage: never

  units:
    runs-on: ubuntu-latest
    name: Units (Ⓐ${{ matrix.ansible }})
    strategy:
      fail-fast: true
      matrix:
        ansible:
          - stable-2.18
          - stable-2.19
          - stable-2.20
          - stable-2.21
          - devel

    steps:
      - name: Run unit tests
        uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: units
          coverage: always

      # The action's built-in upload is skipped because it looks for the report
      # before generating it. Upload manually until upstream PR #128 is released:
      # https://github.com/ansible-community/ansible-test-gh-action/pull/128
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: ansible_collections/rkozlo/valkey
          files: tests/output/reports/coverage=units.xml
          flags: units
          fail_ci_if_error: true

  integration:
    runs-on: ubuntu-latest
    name: "Integration valkey=${{ matrix.valkey_version }} ansible=${{ matrix.ansible }}"

    strategy:
      fail-fast: false
      matrix:
        ansible:
          - stable-2.18
          - stable-2.19
          - stable-2.20
          - stable-2.21
          - devel
        valkey_version:
          - "7.2.14"
          - "8.0.11"
          - "8.1.10"
          - "9.0.6"
          - "9.1.2"
        include:
        - ansible: stable-2.18
          secret_hidden: true
        - ansible: stable-2.19
          secret_hidden: true
        - ansible: stable-2.20
          secret_hidden: true
        - ansible: stable-2.21
          secret_hidden: true
        - ansible: devel
          secret_hidden: false
    steps:
      - name: Run integration tests
        uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: integration
          coverage: always
          pre-test-cmd: |
            printf '%s\n' \
              'secret_hidden: ${{ matrix.secret_hidden }}' \
              'valkey_version: "${{ matrix.valkey_version }}"' \
              > ./tests/integration/targets/setup_valkey/vars/main.yml

      # The action's built-in upload is skipped because it looks for the report
      # before generating it. Upload manually until upstream PR #128 is released:
      # https://github.com/ansible-community/ansible-test-gh-action/pull/128
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: ansible_collections/rkozlo/valkey
          files: tests/output/reports/coverage=integration.xml
          flags: integration
          fail_ci_if_error: true
